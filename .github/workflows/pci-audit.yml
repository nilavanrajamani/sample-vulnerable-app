# PCI DSS 4.0 Compliance Audit — PR Scan
#
# Triggers on pull requests to main/develop.
# Only scans files changed in the PR.
#
# IMPORTANT — 'secrets: inherit' forwards secrets from THIS repository.
# Required secrets: AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_API_KEY,
#   AZURE_OPENAI_DEPLOYMENT, AZURE_OPENAI_API_VERSION

name: PCI DSS Compliance Audit

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  pr-scan:
    name: PCI DSS PR Scan
    uses: nilavanrajamani/pci-auditor/.github/workflows/pci-pr-scan.yml@main
    with:
      base_branch: ${{ github.event.pull_request.base.ref || 'main' }}
      fail_on: 'critical,high'
    secrets: inherit
