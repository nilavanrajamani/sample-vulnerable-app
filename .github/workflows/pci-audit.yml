# PCI DSS 4.0 Compliance Audit — Caller Workflow
#
# Triggers on pull requests to main/develop and on manual dispatch.
# Calls the reusable scan workflow from the pci-auditor repository.
#
# IMPORTANT — 'secrets: inherit' forwards secrets from THIS repository
# (sample-vulnerable-app), not from the pci-auditor repository.
# Declare the following as repository secrets (or organisation secrets
# accessible to this repo) in sample-vulnerable-app:
#   AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_API_KEY, AZURE_OPENAI_DEPLOYMENT,
#   AZURE_OPENAI_API_VERSION, AZURE_OPENAI_EMBEDDING_DEPLOYMENT,
#   AZURE_SEARCH_ENDPOINT, AZURE_SEARCH_API_KEY, AZURE_SEARCH_INDEX_NAME

name: PCI DSS Compliance Audit

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of scan to run'
        required: true
        default: 'codebase'
        type: choice
        options:
          - pr
          - codebase
      path:
        description: 'Path to scan (default: workspace root)'
        required: false
        default: '.'
        type: string
      output_format:
        description: 'Output format'
        required: false
        default: 'sarif'
        type: choice
        options:
          - console
          - json
          - sarif
      output_file:
        description: 'Output file path'
        required: false
        default: 'pci-results.sarif'
        type: string
      fail_on:
        description: 'Severities to fail on (comma-separated)'
        required: false
        default: 'critical,high'
        type: string
      no_ai:
        description: 'Disable AI analysis (pattern-only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  pr-scan:
    name: PCI DSS PR Scan
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.scan_type == 'pr')
    uses: nilavanrajamani/pci-auditor/.github/workflows/pci-pr-scan.yml@main
    with:
      base_branch: ${{ github.event.pull_request.base.ref || 'main' }}
      fail_on: ${{ github.event.inputs.fail_on || 'critical,high' }}
    secrets: inherit

  full-scan:
    name: PCI DSS Full Codebase Scan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.scan_type == 'codebase'
    uses: nilavanrajamani/pci-auditor/.github/workflows/pci-full-scan.yml@main
    with:
      path: ${{ github.event.inputs.path || '.' }}
      output_format: ${{ github.event.inputs.output_format || 'sarif' }}
      output_file: ${{ github.event.inputs.output_file || 'pci-results.sarif' }}
      fail_on: ${{ github.event.inputs.fail_on || 'critical,high' }}
      no_ai: ${{ fromJSON(github.event.inputs.no_ai || 'false') }}
    secrets: inherit